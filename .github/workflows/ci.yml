name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tickets
          MYSQL_USER: tickets
          MYSQL_PASSWORD: tickets
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utickets -ptickets"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tickets
      DB_USER: tickets
      DB_PASS: tickets

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: install dependencies
        run: composer install --no-interaction --no-progress

      - name: load schema and seed
        run: |
          mysql -h 127.0.0.1 -utickets -ptickets tickets < db/01_schema.sql
          mysql -h 127.0.0.1 -utickets -ptickets tickets < db/02_seed.sql

      - name: create the test users the HTTP script logs in as
        run: |
          php bin/create_user.php admin@example.com demo1234 admin
          php bin/create_user.php agent@example.com demo1234 agent

      - name: unit tests
        run: vendor/bin/phpunit --no-coverage

      - name: http assertions
        run: |
          php -S 127.0.0.1:8081 tests/fake_rag.php > /tmp/rag.log 2>&1 &
          RAG_BASE_URL=http://127.0.0.1:8081 php -S 127.0.0.1:8080 -t public server.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/login > /dev/null && break
            sleep 1
          done
          php tests/http_check.php http://127.0.0.1:8080

      - name: diagnostics when the assertions fail
        if: failure()
        run: |
          echo "=== server log ==="
          cat /tmp/server.log || true
          echo "=== fake rag log ==="
          cat /tmp/rag.log || true
          echo "=== users table ==="
          mysql -h 127.0.0.1 -utickets -ptickets tickets -e "SELECT id,email,LEFT(pass_hash,7) AS h,role FROM users" || true
          echo "=== login response ==="
          curl -s -i -X POST http://127.0.0.1:8080/login -d 'email=admin@example.com&password=demo1234' | head -25 || true
